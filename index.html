<!DOCTYPE html> 
<html> 
  <head> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Reenie+Beanie&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <link rel="stylesheet" href="style.css">
  </head> 
  <body> 
    <div class="header-container"> 
                <img src="cafelogo.png"> 
                <div class="botoes-container"> 
                <a href='https://www.google.com/'><button id="botaoheader"> Conheça </button></a>
                <a href='https://www.google.com/'><button id="botaoheader"> Cardápio </button></a> 
                <a href='https://www.google.com/'><button id="botaoheader"> Contato </button></a> 
                <a href='https://www.whatsapp.com/'> <button id="botaoimagem"> <img src="icon1.svg" alt="Ícone" width="32" height="28" fill="currentColor"> </button></a>
                <a href='https://www.youtube.com/'> <button id="botaoimagem"> <img src="icon2.svg" alt="Ícone" width="32" height="28" fill="currentColor"> </button></a>
                <a href='https://www.instagram.com/'> <button id="botaoimagem"> <img src="icon3.svg" alt="Ícone" width="32" height="28" fill="currentColor"> </button></a> 
                </div> 
            </div>
            <div class="head-display">
                <img class="background" src="cafeplace.png">
                <img class="main-logo" src="cafelogo2.png" height="300">
                  <p class="main-text"> O melhor do Brasil para os amantes de café! <p>
            </div>
    <div class="site-body">
      <h>
        <span style="color: rgb(86,48,26);">Os mais pedidos.</span>
        <span style="color: rgb(143, 108, 93);"> Esses são os queridinhos da casa.</span>
      </h>

      <div class="container">
        <div class="swiper card-wrapper">
          <ul class="swiper-wrapper lista-cards">
            <li class="swiper-slide item-card">
              <a href="#" class="link-card">
                <img src="cardslider1/capuccino.jpeg" alt="Cappuccino" class="imagem-card">
              </a>
            </li>
            <li class="swiper-slide item-card">
              <a href="#" class="link-card">
                <img src="cardslider1/affogato.jpeg" alt="Affogato" class="imagem-card">
              </a>
            </li>
            <li class="swiper-slide item-card">
              <a href="#" class="link-card">
                <img src="cardslider1/espresso.jpeg" alt="Espresso" class="imagem-card">
              </a>
            </li>
            <li class="swiper-slide item-card">
              <a href="#" class="link-card">
                <img src="cardslider1/coldbrew.jpeg" alt="Cold Brew" class="imagem-card">
              </a>
            </li>
            <li class="swiper-slide item-card">
              <a href="#" class="link-card">
                <img src="cardslider1/hotchoco.jpeg" alt="Chocolate Quente" class="imagem-card">
              </a>
            </li>
            <li class="swiper-slide item-card">
              <a href="#" class="link-card">
                <img src="cardslider1/mocha.jpeg" alt="Mocha" class="imagem-card">
              </a>
            </li>
          </ul>

          <div class="swiper-pagination"></div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="script.js"></script>

    </div>

    <div class="footer">
      <img src="cafelogofooter.png" alt="Logo do Café" class="footer-logo">
      <div class="botoesfooter">
        <a href='https://www.google.com/'><button id="botaofooter"> Home </button></a>
        <a href='https://www.google.com/'><button id="botaofooter"> Cardápio </button></a>
        <a href='https://www.google.com/'><button id="botaofooter"> Contato </button></a>
      </div>
    </div>
  </body> 
</html>
